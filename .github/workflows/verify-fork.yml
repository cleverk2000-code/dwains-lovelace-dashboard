name: Verify DD3 fork features
on:
  push:
    branches: ["3.0"]
  pull_request:
    branches: ["3.0"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/fork-check.cjs verify
